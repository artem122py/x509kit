name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Run test suite
        run: python test_all.py

      - name: Check docs
        run: python check_docs.py

      - name: Check dispatcher
        run: python check_dispatcher.py

      - name: Check no hidden deps
        run: python check_no_hidden.py

      - name: Quick fuzz
        run: python fuzz_x509.py --quick

      - name: Install cryptography
        run: pip install cryptography

      - name: Cross-verify with cryptography
        run: python compat_test.py

  live:
    name: live (ubuntu-latest / py3.12)
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show openssl
        run: openssl version

      - name: Install package + flask
        run: |
          pip install -e .
          pip install flask

      - name: Locate live test files
        run: |
          echo "--- test_live_ca.py ---"
          find . -name "test_live_ca.py" -not -path "./.git/*"
          echo "--- test_mtls.py ---"
          find . -name "test_mtls.py" -not -path "./.git/*"
          echo "--- all .py in root and flask/ ---"
          ls -la *.py flask/*.py 2>/dev/null || true

      - name: Run live test (if present)
        run: |
          LIVE=$(find . -name "test_live_ca.py" -not -path "./.git/*" | head -1)
          if [ -z "$LIVE" ]; then
            echo "test_live_ca.py not found - skipping"
            exit 0
          fi
          echo "Running: $LIVE"
          python "$LIVE"

      - name: Run mTLS test (if present)
        run: |
          MTLS=$(find . -name "test_mtls.py" -not -path "./.git/*" | head -1)
          if [ -z "$MTLS" ]; then
            echo "test_mtls.py not found - skipping"
            exit 0
          fi
          echo "Running: $MTLS"
          python "$MTLS"

  publish:
    name: publish to PyPI
    needs: [unit, live]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/x509kit
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
