name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Run test suite
        run: python test_all.py

      - name: Check docs
        run: python check_docs.py

      - name: Check dispatcher
        run: python check_dispatcher.py

      - name: Check no hidden deps
        run: python check_no_hidden.py

      - name: Quick fuzz
        run: python fuzz_x509.py --quick

      - name: Install cryptography
        run: pip install cryptography

      - name: Cross-verify with cryptography
        run: python compat_test.py

  live:
    name: live (ubuntu-latest / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openssl
        run: |
          openssl version
          which openssl

      - name: Install package + flask
        run: |
          pip install -e .
          pip install flask

      - name: Live CA test (openssl verify, crl_check)
        run: python test_live_ca.py

      - name: mTLS test
        run: python flask/test_mtls.py
