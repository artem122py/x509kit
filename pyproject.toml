[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x509kit"
version = "0.4.0"
description = "Pure-Python X.509 / PKCS#10 / CRL / OCSP / PKCS#12 toolkit — stdlib only"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "ArtProsto", email = "artemkamirn@mail.ru" },
]
keywords = [
    "x509", "certificate", "pki", "csr", "crl", "ocsp", "pkcs12",
    "asn1", "der", "pem", "rsa", "ed25519", "ecdsa", "tls", "mtls",
    "cryptography", "stdlib",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "build",
    "twine",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/artem122py/x509kit"
Documentation = "https://github.com/artem122py/x509kit#readme"
Source = "https://github.com/artem122py/x509kit"
Issues = "https://github.com/artem122py/x509kit/issues"
Changelog = "https://github.com/artem122py/x509kit/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
x509kit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
    "E501",   # line too long — не критично
    "N802",   # function name should be lowercase — нет, у нас API с getX
    "N806",   # variable in function should be lowercase
    "B008",   # function call in default argument
]
